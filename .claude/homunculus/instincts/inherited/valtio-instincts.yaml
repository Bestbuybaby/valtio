# Valtio Workflow Multi Directory Dependency Upgrade

## Action

Follow the multi-directory-dependency-upgrade workflow:
1. Identify outdated dependencies in each relevant directory.
2. Update dependency versions in lockfiles (e.g., yarn.lock, pnpm-lock.yaml) and package manifests (e.g., package.json) for each directory.
3. Commit all updated lockfiles and manifests together, often with a detailed changelog in the commit message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: examples/*/yarn.lock, website/package.json, website/pnpm-lock.yaml

